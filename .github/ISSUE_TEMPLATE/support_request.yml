name: Support request
description: Ask for help with setup, usage, deployment, or repo automation.
title: "[support]: "
labels:
  - triage
  - needs-info
body:
  - type: markdown
    attributes:
      value: |
        For general help, GitHub Discussions is preferred.

        If you need repository-specific support, fill out the details below.
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Describe the task you are trying to complete and where you are blocked.
      placeholder: I am trying to deploy the app to...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local OS, Docker, CI, AWS, Kubernetes, or other relevant environment details.
      placeholder: Windows 11 + Docker Desktop, GitHub Actions, EKS, etc.
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Commands, docs, or workflows you already attempted.
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste any relevant logs or command output.
      render: shell
