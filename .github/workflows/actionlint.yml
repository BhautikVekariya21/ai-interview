name: actionlint

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
  push:
    branches:
      - main
      - develop
    paths:
      - .github/workflows/**
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: devops-actions/actionlint@v0.1.10
