name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image_name: BACKEND_IMAGE_NAME
            dockerfile: docker/backend.Dockerfile
          - name: frontend
            image_name: FRONTEND_IMAGE_NAME
            dockerfile: docker/frontend.Dockerfile
            build_args: |
              VITE_API_BASE_URL=/
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env[matrix.image_name] }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/production/*,deploy/scripts/deploy.sh"
          target: "~/ai-interview"
          strip_components: 1

      - name: Run remote deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          FRONTEND_IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BACKEND_IMAGE_REPOSITORY,FRONTEND_IMAGE_REPOSITORY,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            chmod +x ~/ai-interview/deploy.sh
            BACKEND_IMAGE_REPOSITORY="$BACKEND_IMAGE_REPOSITORY" FRONTEND_IMAGE_REPOSITORY="$FRONTEND_IMAGE_REPOSITORY" IMAGE_TAG="$IMAGE_TAG" ~/ai-interview/deploy.sh

  deploy-aws:
    name: Deploy to AWS EKS
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' && secrets.AWS_REGION != '' && secrets.AWS_ACCOUNT_ID != '' && secrets.EKS_CLUSTER_NAME != '' }}
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Run AWS EKS deploy
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          ECR_REPOSITORY_PREFIX: ${{ secrets.ECR_REPOSITORY_PREFIX || 'ai-interview-prod' }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          chmod +x deploy/aws/scripts/deploy-eks.sh
          deploy/aws/scripts/deploy-eks.sh

  smoke-server:
    name: Smoke Test Server Deploy
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ needs.deploy.result == 'success' && vars.DEPLOY_HEALTHCHECK_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run server smoke checks
        env:
          SMOKE_TARGETS: |
            production-api|${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: python .github/scripts/http_smoke.py

  smoke-aws:
    name: Smoke Test AWS Deploy
    needs: deploy-aws
    runs-on: ubuntu-latest
    if: ${{ needs.deploy-aws.result == 'success' && vars.AWS_DEPLOY_HEALTHCHECK_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AWS smoke checks
        env:
          SMOKE_TARGETS: |
            aws-api|${{ vars.AWS_DEPLOY_HEALTHCHECK_URL }}
        run: python .github/scripts/http_smoke.py
