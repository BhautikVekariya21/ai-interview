name: Greetings
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the AI Interview project! We're glad you're here. A maintainer will look at your issue shortly."
          pr-message: "Thank you for your first Pull Request! We appreciate your contribution to the AI Interview project. Please ensure CI passes before requesting a review."
