name: Infrastructure Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    paths:
      - "deploy/aws/terraform/**"
      - "k8s/**"
      - "docker/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  kubernetes:
    name: Kubernetes Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate core manifests
        run: |
          kubeconform -summary -ignore-missing-schemas k8s/*.yaml

      - name: Validate optional tooling manifests
        run: |
          kubeconform -summary -ignore-missing-schemas k8s/optional-tools/**/*.yaml

  security:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile,github_actions
          quiet: true
