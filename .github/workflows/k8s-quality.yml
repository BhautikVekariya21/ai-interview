name: Kubernetes Quality

on:
  pull_request:
    paths:
      - k8s/**
      - deploy/aws/scripts/**
      - .github/workflows/k8s-quality.yml
  push:
    branches:
      - main
      - develop
    paths:
      - k8s/**
      - deploy/aws/scripts/**
      - .github/workflows/k8s-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validate Kubernetes quality and overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install kube-score
        run: |
          curl -sSL -o kube-score https://github.com/zegl/kube-score/releases/download/v1.19.0/kube-score_1.19.0_linux_amd64
          chmod +x kube-score
          sudo mv kube-score /usr/local/bin/kube-score

      - name: Render base manifests
        run: kubectl kustomize k8s > rendered-base.yaml

      - name: Render AWS overlay
        run: kubectl kustomize k8s/overlays/aws > rendered-aws.yaml

      - name: Run kube-score on base
        run: kube-score score rendered-base.yaml --ignore-test container-image-tag

      - name: Run kube-score on AWS overlay
        run: kube-score score rendered-aws.yaml --ignore-test container-image-tag
