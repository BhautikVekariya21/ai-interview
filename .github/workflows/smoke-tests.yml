name: Smoke Tests

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Run live smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run smoke checks
        env:
          SMOKE_TARGETS: |
            production-api|${{ vars.DEPLOY_HEALTHCHECK_URL }}
            aws-api|${{ vars.AWS_DEPLOY_HEALTHCHECK_URL }}
        run: python .github/scripts/http_smoke.py
