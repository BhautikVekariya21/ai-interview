name: Stale Triage

on:
  schedule:
    - cron: "15 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale threads
        uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been quiet for a while. If it is still relevant, add an update
            and we will keep it open.
          close-issue-message: >
            Closing this issue automatically because it went stale without follow-up.
          stale-pr-message: >
            This pull request has been inactive for a while. Add an update or rebase if it
            still needs review.
          close-pr-message: >
            Closing this pull request automatically because it went stale without follow-up.
          days-before-issue-stale: 45
          days-before-issue-close: 10
          days-before-pr-stale: 30
          days-before-pr-close: 7
          exempt-issue-labels: security,needs-human,ops
          exempt-pr-labels: security,needs-human,dependencies
          remove-stale-when-updated: true
