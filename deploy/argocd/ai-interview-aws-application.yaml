apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-interview-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/ai-interview.git
    targetRevision: main
    path: k8s/overlays/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-interview
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
