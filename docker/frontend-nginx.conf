server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /favicon.ico {
    try_files $uri =404;
  }

  location = /favicon.svg {
    try_files $uri =404;
  }

  location = /robots.txt {
    try_files $uri =404;
  }

  location = /sitemap.xml {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
