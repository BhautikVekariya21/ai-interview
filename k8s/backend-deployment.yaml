apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/owner/ai-interview-backend:latest
          ports:
            - containerPort: 7860
          envFrom:
            - configMapRef:
                name: ai-interview-app-config
            - secretRef:
                name: ai-interview-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 7860
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7860
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: recordings
              mountPath: /app/recordings
            - name: audio-cache
              mountPath: /app/audio_cache
      volumes:
        - name: uploads
          emptyDir: {}
        - name: recordings
          emptyDir: {}
        - name: audio-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 7860
      targetPort: 7860
