apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-interview
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:123456789012:certificate/replace-me
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/group.name: ai-interview
    external-dns.alpha.kubernetes.io/hostname: interviewer.example.com
spec:
  ingressClassName: alb
  rules:
    - host: interviewer.example.com
